<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Boissons ANBA – Hors connexion</title><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Boissons ANBA"><link rel="manifest" href="./manifest.webmanifest"><style>body{font-family:-apple-system,system-ui;margin:0;background:#f4f4f4;color:#111}header{background:#111;color:#fff;padding:16px;text-align:center}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 5px #bbb}button,.file{display:block;width:100%;box-sizing:border-box;padding:14px;margin:9px 0;border:0;border-radius:10px;background:#111;color:#fff;font-size:17px;text-align:center}button.alt{background:#555}button.danger{background:#9b1c1c}input[type=file]{display:none}canvas{width:100%;height:auto;border-radius:8px;background:#ddd}.grid{display:grid;grid-template-columns:1fr auto;gap:7px;border-bottom:1px solid #ddd;padding:7px 0}.ok{font-weight:700}.warn{color:#9b1c1c;font-weight:700}.small{font-size:13px;color:#666}</style></head><body><header><b>Boissons ANBA</b><br><small>Hors connexion</small></header><main><div class="card"><label class="file" for="photo">Photographier / choisir une fiche</label><input id="photo" type="file" accept="image/*" capture="environment"><canvas id="cv"></canvas><div id="status" class="small">Aucune fiche chargée.</div></div><div class="card"><h3>Lecture</h3><div id="result">—</div><button id="validate" disabled>Valider la commande</button></div><div class="card"><h3>Totaux enregistrés</h3><div id="totals"></div><button class="danger" id="reset">Tout annuler</button></div></main><script>
const drinks=['Whisky Antiquity Blue','Whisky Royal Challenge','Brandy Morpheus','Bière','Martini','Punch','Porto','Bacardi Breezer','Eau','Coca-Cola','Jus de fruits','Soda'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),statusEl=document.getElementById('status'),result=document.getElementById('result'),validate=document.getElementById('validate'); let current=null;
function store(){return JSON.parse(localStorage.getItem('anbaOrders')||'[]')} function save(x){localStorage.setItem('anbaOrders',JSON.stringify(x));renderTotals()}
function renderTotals(){let t=Object.fromEntries(drinks.map(x=>[x,0]));store().forEach(o=>o.items.forEach((v,i)=>t[drinks[i]]+=v));document.getElementById('totals').innerHTML=drinks.map(d=>`<div class="grid"><span>${d}</span><b>${t[d]}</b></div>`).join('')}
function gray(data,w,x,y,r){let s=0,n=0;for(let yy=Math.max(0,y-r);yy<Math.min(data.height,y+r);yy++)for(let xx=Math.max(0,x-r);xx<Math.min(w,x+r);xx++){let k=(yy*w+xx)*4;s+=(data.data[k]+data.data[k+1]+data.data[k+2])/3;n++}return s/n}
// Model coordinates measured from the supplied reference sheet. Reading is intentionally constrained to this fixed form.
function readSheet(){let W=cv.width,H=cv.height,img=ctx.getImageData(0,0,W,H); // crop/model fractions for photographed full page
let rows=[.357,.397,.437,.477,.548,.588,.628,.668,.748,.788,.828,.868]; let cols=[.505,.555,.605,.655,.705,.755]; let items=[],conf=[];
for(let ry of rows){let vals=cols.map(cx=>gray(img,W,Math.round(cx*W),Math.round(ry*H),Math.max(5,Math.round(W*.012))));let base=vals.slice().sort((a,b)=>a-b);let k=vals.indexOf(Math.min(...vals));let sorted=[...vals].sort((a,b)=>a-b);let delta=sorted[1]-sorted[0]; // filled circle must be substantially darker than its peers
if(delta>22 && sorted[0]<175){items.push(k+1);conf.push(delta)} else {items.push(0);conf.push(delta)}}
let good=conf.filter(x=>x>22).length; current={table:'?',order:'?',items,confidence:good/12}; result.innerHTML=drinks.map((d,i)=>`<div class="grid"><span>${d}</span><b>${items[i]||'—'}</b></div>`).join('')+`<p class="${good>=1?'ok':'warn'}">Lecture géométrique : ${good}/12 ligne(s) marquée(s) détectée(s).</p><p class="small">Cette première version refuse de deviner les lignes ambiguës. Les numéros table/commande seront ajoutés au modèle après calibration sur les fiches imprimées.</p>`;validate.disabled=false;statusEl.textContent='Fiche analysée localement. Aucune image envoyée sur Internet.'}
document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{let scale=Math.min(1,1000/im.width);cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);ctx.drawImage(im,0,0,cv.width,cv.height);readSheet()};im.src=URL.createObjectURL(f)};
validate.onclick=()=>{if(!current)return;let a=store();a.push({...current,ts:Date.now()});save(a);alert('Commande enregistrée sur cet appareil.');current=null;validate.disabled=true};document.getElementById('reset').onclick=()=>{if(confirm('Effacer TOUS les totaux ?')&&confirm('Confirmation définitive : tout supprimer ?')){save([])}};renderTotals();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
