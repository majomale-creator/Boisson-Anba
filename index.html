<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-title" content="Boissons ANBA"><link rel="manifest" href="./manifest.webmanifest"><title>Boissons ANBA</title><style>body{font-family:-apple-system,system-ui;margin:0;background:#f2f2f2;color:#111}header{background:#111;color:#fff;padding:14px;text-align:center}main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 5px #bbb}.file,button{display:block;width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#111;color:#fff;font-size:17px;text-align:center}button:disabled{opacity:.35}.danger{background:#9b1c1c}input[type=file]{display:none}canvas{width:100%;height:auto;border-radius:8px;background:#ddd}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #ddd}.good{color:#08752f;font-weight:700}.bad{color:#a01818;font-weight:700}.small{font-size:13px;color:#666}</style></head><body><header><b>Boissons ANBA</b><br><small>Lecteur géométrique hors connexion</small></header><main><div class="card"><label class="file" for="photo">Photographier / choisir une fiche</label><input id="photo" type="file" accept="image/*" capture="environment"><canvas id="cv"></canvas><p id="status" class="small">Aucune fiche chargée.</p></div><div class="card"><h3>Lecture</h3><div id="result">—</div><button id="validate" disabled>Valider la commande</button></div><div class="card"><h3>Totaux</h3><div id="totals"></div><button class="danger" id="reset">Tout annuler</button></div></main><script>
const drinks=['Whisky Antiquity Blue','Whisky Royal Challenge','Brandy Morpheus','Bière','Martini','Punch','Porto','Bacardi Breezer','Eau','Coca-Cola','Jus de fruits','Soda'];
const cv=document.querySelector('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),statusEl=document.querySelector('#status'),result=document.querySelector('#result'),validate=document.querySelector('#validate');let current=null;
const rowsV=[.320,.367,.414,.461,.544,.590,.636,.681,.768,.815,.863,.908];
const colsU=[.601,.672,.749,.824,.899,.975]; // calibrated from the real printed ANBA sheet, in marker-space
function store(){return JSON.parse(localStorage.getItem('anbaOrders')||'[]')}function save(a){localStorage.setItem('anbaOrders',JSON.stringify(a));renderTotals()}
function renderTotals(){let t=Array(12).fill(0);store().forEach(o=>o.items.forEach((v,i)=>t[i]+=v));document.querySelector('#totals').innerHTML=drinks.map((d,i)=>`<div class="row"><span>${d}</span><b>${t[i]}</b></div>`).join('')}
function solve(A,b){for(let i=0;i<8;i++){let m=i;for(let j=i+1;j<8;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];let q=A[i][i];if(Math.abs(q)<1e-9)return null;for(let k=i;k<8;k++)A[i][k]/=q;b[i]/=q;for(let j=0;j<8;j++)if(j!==i){q=A[j][i];for(let k=i;k<8;k++)A[j][k]-=q*A[i][k];b[j]-=q*b[i]}}return b}
function homography(p){let src=[[0,0],[1,0],[0,1],[1,1]],A=[],b=[];for(let i=0;i<4;i++){let [u,v]=src[i],[x,y]=p[i];A.push([u,v,1,0,0,0,-u*x,-v*x]);b.push(x);A.push([0,0,0,u,v,1,-u*y,-v*y]);b.push(y)}return solve(A,b)}
function map(H,u,v){let z=H[6]*u+H[7]*v+1;return[(H[0]*u+H[1]*v+H[2])/z,(H[3]*u+H[4]*v+H[5])/z]}
function detectMarkers(im){let {data,width:w,height:h}=im,seen=new Uint8Array(w*h),cs=[];function dark(i){let k=i*4,r=data[k],g=data[k+1],b=data[k+2];return (r+g+b)/3<125 || (b>r*1.18&&b>g*1.08&&r<150)}
for(let y=0;y<h;y+=1)for(let x=0;x<w;x+=1){let ii=y*w+x;if(seen[ii]||!dark(ii))continue;let stack=[ii];seen[ii]=1;let n=0,minx=x,maxx=x,miny=y,maxy=y,sx=0,sy=0;while(stack.length){let q=stack.pop(),qy=(q/w)|0,qx=q-qy*w;n++;sx+=qx;sy+=qy;if(qx<minx)minx=qx;if(qx>maxx)maxx=qx;if(qy<miny)miny=qy;if(qy>maxy)maxy=qy;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=qx+dx,yy=qy+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;let z=yy*w+xx;if(!seen[z]&&dark(z)){seen[z]=1;stack.push(z)}}}let bw=maxx-minx+1,bh=maxy-miny+1,fill=n/(bw*bh);if(n>120&&bw>12&&bh>12&&bw<w*.12&&bh<h*.12&&bw/bh>.55&&bw/bh<1.8&&fill>.28)cs.push({x:sx/n,y:sy/n,n,bw,bh,fill})}
if(cs.length<4)return null;function pick(tx,ty,used){let best=null,bs=-1e9;for(let c of cs){if(used.has(c))continue;let dx=(c.x/w-tx),dy=(c.y/h-ty),dist=Math.hypot(dx,dy);let score=Math.log(c.n)*2+c.fill*4-dist*7;if(score>bs){bs=score;best=c}}used.add(best);return best}let used=new Set();let tl=pick(.12,.12,used),tr=pick(.88,.12,used),bl=pick(.12,.88,used),br=pick(.88,.88,used);return[[tl.x,tl.y],[tr.x,tr.y],[bl.x,bl.y],[br.x,br.y]]}
function innerScore(im,x,y,r){let {data,width:w,height:h}=im,s=0,n=0,dark=0;for(let yy=Math.max(0,Math.floor(y-r));yy<=Math.min(h-1,Math.ceil(y+r));yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<=Math.min(w-1,Math.ceil(x+r));xx++){let dx=xx-x,dy=yy-y;if(dx*dx+dy*dy>r*r)continue;let k=(yy*w+xx)*4,R=data[k],G=data[k+1],B=data[k+2],lum=(R+G+B)/3;s+=lum;n++;if(lum<150 || (B>R*1.15&&B>G*1.05&&R<180))dark++}return {mean:s/n,frac:dark/n}}
function readSheet(){let im=ctx.getImageData(0,0,cv.width,cv.height),p=detectMarkers(im);if(!p){statusEl.innerHTML='<span class="bad">Fiche refusée : les 4 repères ne sont pas localisés avec certitude.</span>';result.textContent='—';validate.disabled=true;return}let H=homography(p);if(!H){statusEl.textContent='Géométrie impossible.';return}let pageW=(Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1])+Math.hypot(p[3][0]-p[2][0],p[3][1]-p[2][1]))/2,r=Math.max(4,pageW*.0105);let items=[],details=[],amb=false;
for(let v of rowsV){let scores=colsU.map(u=>{let q=map(H,u,v);return innerScore(im,q[0],q[1],r)});let order=scores.map((s,i)=>({i,...s})).sort((a,b)=>b.frac-a.frac);let best=order[0],second=order[1];let hits=order.filter(z=>z.frac>.12);if(hits.length===1){items.push(best.i+1);details.push({ok:true,margin:best.frac-second.frac})}else if(hits.length===0){items.push(0);details.push({ok:true,margin:0})}else{items.push(0);details.push({ok:false,margin:best.frac-second.frac});amb=true}}
current={items,ts:Date.now()};result.innerHTML=drinks.map((d,i)=>`<div class="row"><span>${d}</span><b>${items[i]||'—'}</b></div>`).join('')+(amb?'<p class="bad">Lecture ambiguë : fiche non validable. Reprendre la photo.</p>':'<p class="good">Lecture géométrique terminée. Vérifiez puis validez.</p>');validate.disabled=amb;statusEl.innerHTML='<span class="good">4 repères trouvés. Perspective corrigée. Grille 12 × 6 recalée sur la fiche réelle.</span>'}
document.querySelector('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image();im.onload=()=>{let sc=Math.min(1,800/im.width);cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);ctx.drawImage(im,0,0,cv.width,cv.height);readSheet()};im.src=URL.createObjectURL(f)};
validate.onclick=()=>{if(!current)return;let a=store();a.push(current);save(a);alert('Commande enregistrée sur cet iPhone.');validate.disabled=true};document.querySelector('#reset').onclick=()=>{if(confirm('Effacer TOUS les totaux ?')&&confirm('Confirmation définitive ?'))save([])};renderTotals();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
