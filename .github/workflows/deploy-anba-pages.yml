name: Deploy ANBA PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ANBA PWA
        shell: bash
        run: |
          mkdir -p site
          unzip -q Boissons_ANBA_GitHub_Pages_TABLE_COMMANDE_V2.zip -d site
          test -f site/index.html
          test -f site/sw.js
          test -f site/manifest.webmanifest
          test -d site/_next/static/chunks
          test -d site/_next/static/css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
